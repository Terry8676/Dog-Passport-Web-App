<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Care Passport</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="auth-view" class="auth" hidden>
    <h1 class="brand">Dog Care Passport</h1>
    <div class="card">
      <h2>Sign in</h2>
      <form id="auth-form">
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" placeholder="8+ characters" autocomplete="current-password" required></label>
        <button type="submit" class="wide">Log in</button>
        <button type="button" id="signup-btn" class="secondary wide">Create account</button>
      </form>
      <p id="auth-error" class="error" hidden></p>
    </div>
  </section>

  <div id="app" hidden>
    <nav id="sidebar" aria-label="Dogs">
      <div class="logo">Dog Care Passport</div>
      <div class="side-label">Your dogs</div>
      <div id="dog-list"></div>
      <button type="button" id="add-dog" class="side-btn dashed">+ Add a dog</button>
      <button type="button" id="join-btn" class="side-btn">Join with a code</button>
      <div class="side-foot">
        <div id="user-email"></div>
        <button type="button" id="logout-btn" class="link">Log out</button>
      </div>
    </nav>
    <main id="main"></main>
  </div>

  <dialog id="dlg">
    <form id="dlg-form">
      <h2 id="dlg-title"></h2>
      <div id="dlg-fields"></div>
      <p id="dlg-error" class="error" hidden></p>
      <div class="row end">
        <button type="button" id="dlg-cancel" class="secondary">Cancel</button>
        <button type="submit" id="dlg-ok">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
